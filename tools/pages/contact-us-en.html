<div class="rukn-shape">
<section class="sec">
  <div class="wrap contact-layout">
    <div class="cinfo-card">
      <div class="inner">
        <h3 style="color:#fff;margin-bottom:22px">Reach the Bahrain team</h3>
        <div class="cinfo-item"><i class="fab fa-whatsapp"></i><div><b>WhatsApp</b><small>+971 58 663 4710 (temporary)</small></div></div>
        <div class="cinfo-item"><i class="fas fa-envelope"></i><div><b>Email</b><small>m@rukn-eltatawer.com</small></div></div>
        <div class="cinfo-item"><i class="fas fa-location-dot"></i><div><b>Service area</b><small>Manama, Kingdom of Bahrain</small></div></div>
        <a href="https://wa.me/971586634710" class="btn btn-wa" style="width:100%;margin-top:12px">WhatsApp</a>
      </div>
    </div>
    <div class="form-card">
      <h3>Send a request</h3>
      <p>The form opens WhatsApp with your details. No phone call is required on the temporary number.</p>
      <form class="rukn-wa-form">
        <div class="form-grid">
          <div class="fld"><label>Name</label><input name="Name" required></div>
          <div class="fld"><label>Phone</label><input name="Phone" required></div>
          <div class="fld full"><label>City</label>
            <select name="City"><option>Manama</option><option>Muharraq</option><option>Riffa</option><option>Hamad Town</option><option>Isa Town</option><option>Aali</option><option>Sitra</option><option>Budaiya</option></select>
          </div>
          <div class="fld full"><label>Details</label><textarea name="Details"></textarea></div>
        </div>
        <button type="submit" class="btn btn-quote" style="width:100%;margin-top:20px">Send on WhatsApp</button>
      </form>
    </div>
  </div>
</section>
</div>
